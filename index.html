<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Digital Clock (IST)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        .clock-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .title {
            font-size: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #00ffcc;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .time {
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }
        .date {
            font-size: 20px;
            margin-top: 15px;
            color: #dddddd;
            letter-spacing: 1px;
        }
        @media (max-width: 600px) {
            .clock-box {
                padding: 30px 25px;
            }
            .time {
                font-size: 40px;
            }
            .date {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="clock-box">
    <div class="title">🇮🇳 Indian Standard Time (IST)</div>
    <div class="time" id="clock">00:00:00 AM</div>
    <div class="date" id="date">Loading Date...</div>
</div>

<script>
    function updateIndianClock() {
        const now = new Date();

        const timeOptions = {
            timeZone: 'Asia/Kolkata',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
        };

        const dateOptions = {
            timeZone: 'Asia/Kolkata',
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        };

        const indianTime = now.toLocaleTimeString('en-IN', timeOptions).toUpperCase();
        const indianDate = now.toLocaleDateString('en-IN', dateOptions);

        document.getElementById('clock').textContent = indianTime;
        document.getElementById('date').textContent = indianDate;
    }

    setInterval(updateIndianClock, 1000);
    updateIndianClock();
</script>

</body>
</html>
